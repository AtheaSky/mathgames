<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style/main.css" />
    <link rel="stylesheet" href="./style/cafe.css" />

    <script defer src="./scripts/modal.js"></script>
    <script defer src="./scripts/cafe.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-confetti@latest/dist/js-confetti.browser.js"></script>

    <!-- Title font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Momo+Trust+Display&display=swap"
      rel="stylesheet"
    />

    <!-- Text on tab name -->
    <title>Cat Café</title>

    <!-- Site icon on tab. Do one of the following:
        * Replace "favicon.png" in images folder with your icon of same name
        * Rename href below to "./images/(YOUR-IMAGE.EXTENSION)"
        * Rename href below to "(IMAGE-WEB-URL.EXTENSION)" -->
    <link rel="icon" type="image/png" href="./images/favicon.png" />
  </head>

  <body>
    <div class="cursor"></div>
    <div class="modal" id="petModal">
      <div class="modal-content">
        <p>Visit which café?</p>
        <div class="modalBtn btn petChoice" onClick="choosePet('cat')">Cat</div>
        <div class="modalBtn btn petChoice" onClick="choosePet('hamster')">
          Hamster
        </div>
      </div>
    </div>

    <h1>Pet Café</h1>

    <div class="gridwrap">
      <div class="speech">
        <img
          src="./images/speech.png"
          width="250px"
          id="speechImg"
          hidden="true"
        />
      </div>
      <div class="pet">
        <img width="220px" id="pet" />
      </div>
      <div class="right">
        <img
          id="treatBag"
          class="btn"
          width="150px"
          draggable="false"
          onclick="createTreat()"
        />
      </div>

      <div class="speech" id="speechLabel" hidden="true">Mode?</div>
      <div class="speech" id="speechBox" hidden="true"></div>
      <div class="right" id="snackSpot"></div>
    </div>

    <!-- Instructions -->
    <hr />
    <p>
      Choose NUMBER or ADDITION mode by clicking the text.<br />
      Click the treat bag to take a treat.<br />Drag treats to the bowl until it
      has how many it asked for!
    </p>
  </body>
</html>
