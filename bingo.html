<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./main.css" />

    <script src="./scripts/changecol.js"></script>

    <!-- Title font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Momo+Trust+Display&display=swap"
      rel="stylesheet"
    />

    <!-- Text on tab name -->
    <title>Math Bingo</title>

    <!-- Site icon on tab. Do one of the following:
        * Replace "favicon.png" in images folder with your icon of same name
        * Rename href below to "./images/(YOUR-IMAGE.EXTENSION)"
        * Rename href below to "(IMAGE-WEB-URL.EXTENSION)" -->
    <link rel="icon" type="image/png" href="./images/favicon.png" />
  </head>

  <body>
    <h1>Math Bingo</h1>

    <div class="gridwrap">
      <!-- Colours -->
      <div class="left">
        <table>
          <!-- Row 1 -->
          <tr>
            <td class="col1" onclick="changecol(1)"></td>
            <td class="col2" onclick="changecol(2)"></td>
          </tr>
          <!-- Row 2 -->
          <tr>
            <td class="col3" onclick="changecol(3)"></td>
            <td class="col4" onclick="changecol(4)"></td>
          </tr>
          <!-- Row 3 -->
          <tr>
            <td class="col5" onclick="changecol(5)"></td>
            <td class="col6" onclick="changecol(6)"></td>
          </tr>
          <!-- Row 4 -->
          <tr>
            <td class="col7" onclick="changecol(7)"></td>
            <td class="col8" onclick="changecol(8)"></td>
          </tr>
        </table>
      </div>

      <!-- Bingo Board -->
      <div class="bingo" class="mid">
        <table>
          <!-- Row 1 -->
          <tr>
            <td>32</td>
            <td>40</td>
            <td>45</td>
            <td>112</td>
          </tr>
          <!-- Row 2 -->
          <tr>
            <td>81</td>
            <td>6</td>
            <td>110</td>
            <td>50</td>
          </tr>
          <!-- Row 3 -->
          <tr>
            <td>56</td>
            <td>12</td>
            <td>25</td>
            <td>56</td>
          </tr>
          <!-- Row 4 -->
          <tr>
            <td>65</td>
            <td>60</td>
            <td>75</td>
            <td>20</td>
          </tr>
        </table>
      </div>

      <!-- Game Numbers -->
      <div class="right">
        <h2>7</h2>
        <h2>9</h2>
        <h2>1</h2>
        <h2>6</h2>
      </div>
    </div>
  </body>
</html>
