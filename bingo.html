<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./main.css" />

    <!-- Title font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Momo+Trust+Display&display=swap"

    />

    <!-- Text on tab name -->
    <title>Math Bingo</title>

    <!-- Site icon on tab. Do one of the following:
        * Replace "favicon.png" in images folder with your icon of same name
        * Rename href below to "./images/(YOUR-IMAGE.EXTENSION)"
        * Rename href below to "(IMAGE-WEB-URL.EXTENSION)" -->
    <link rel="icon" type="image/png" href="./images/favicon.png" />

          </tr>
          <!-- Row 3 -->
          <tr>
            <td>56</td>
            <td>12</td>

          <!-- Row 4 -->
          <tr>
            <td>65</td>

      <div class="item3">numbers</div>

</html>
