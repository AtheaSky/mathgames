<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style/main.css" />
    <link rel="stylesheet" href="./style/bingo.css" />

    <script src="./scripts/colours.js"></script>
    <script src="./scripts/bingoNum.js"></script>

    <!-- Title font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Momo+Trust+Display&display=swap"
      rel="stylesheet"
    />

    <!-- Text on tab name -->
    <title>Math Bingo</title>

    <!-- Site icon on tab. Do one of the following:
        * Replace "favicon.png" in images folder with your icon of same name
        * Rename href below to "./images/(YOUR-IMAGE.EXTENSION)"
        * Rename href below to "(IMAGE-WEB-URL.EXTENSION)" -->
    <link rel="icon" type="image/png" href="./images/favicon.png" />
  </head>

  <body>
    <h1>Math Bingo</h1>

    <div class="gridwrap">
      <!-- Colours -->
      <div class="left">
        <table>
          <!-- Row 1 -->
          <tr>
            <td id="col1" class="col1" onclick="changeActiveCol(1)"></td>
            <td id="col2" class="col2" onclick="changeActiveCol(2)"></td>
          </tr>
          <!-- Row 2 -->
          <tr>
            <td id="col3" class="col3" onclick="changeActiveCol(3)"></td>
            <td id="col4" class="col4" onclick="changeActiveCol(4)"></td>
          </tr>
          <!-- Row 3 -->
          <tr>
            <td id="col5" class="col5" onclick="changeActiveCol(5)"></td>
            <td id="col6" class="col6" onclick="changeActiveCol(6)"></td>
          </tr>
          <!-- Row 4 -->
          <tr>
            <td id="col7" class="col7" onclick="changeActiveCol(7)"></td>
            <td id="col8" class="col8" onclick="changeActiveCol(8)"></td>
          </tr>
        </table>
      </div>

      <!-- Bingo Board -->
      <div class="bingo" class="mid">
        <table>
          <!-- Row 1 -->
          <tr>
            <td id="cell1" onclick="updateCol(id)"></td>
            <td id="cell2" onclick="updateCol(id)"></td>
            <td id="cell3" onclick="updateCol(id)"></td>
            <td id="cell4" onclick="updateCol(id)"></td>
          </tr>
          <!-- Row 2 -->
          <tr>
            <td id="cell5" onclick="updateCol(id)"></td>
            <td id="cell6" onclick="updateCol(id)"></td>
            <td id="cell7" onclick="updateCol(id)"></td>
            <td id="cell8" onclick="updateCol(id)"></td>
          </tr>
          <!-- Row 3 -->
          <tr>
            <td id="cell9" onclick="updateCol(id)"></td>
            <td id="cell10" onclick="updateCol(id)"></td>
            <td id="cell11" onclick="updateCol(id)"></td>
            <td id="cell12" onclick="updateCol(id)"></td>
          </tr>
          <!-- Row 4 -->
          <tr>
            <td id="cell13" onclick="updateCol(id)"></td>
            <td id="cell14" onclick="updateCol(id)"></td>
            <td id="cell15" onclick="updateCol(id)"></td>
            <td id="cell16" onclick="updateCol(id)"></td>
          </tr>
        </table>
      </div>

      <!-- Game Numbers -->
      <div class="right">
        <h2 id="num1"></h2>
        <h2 id="num2"></h2>
        <h2 id="num3"></h2>
        <h2 id="num4"></h2>
      </div>
    </div>

    <!-- Setup -->
    <form action="" id="boardSettings">
      <!-- Board Range -->
      <h3>Board Range</h3>
      <!-- Board minimum -->
      <div>
        <label for="boardMin">Min:</label>
        <input type="number" id="boardMin" min="1" max="100" value="5" />
      </div>

      <!-- Board maximum -->
      <div>
        <label for="boardMax">Max:</label>
        <input type="number" id="boardMax" min="16" max="1000" value="120" />
      </div>

      <!-- Your numbers maximum -->
      <div>
        <h3>Your Numbers Range</h3>
        <label for="yourMax">Max:</label>
        <input type="number" id="yourMax" min="1" max="100" value="9" />
      </div>

      <!-- Generate board -->
      <input type="button" value="Generate Board" onclick="genBoard()" />
    </form>
  </body>
</html>
