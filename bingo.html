<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./main.css" />

    <script src="./scripts/changecol.js"></script>

    <!-- Title font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Momo+Trust+Display&display=swap"
      rel="stylesheet"
    />

    <!-- Text on tab name -->
    <title>Math Bingo</title>

    <!-- Site icon on tab. Do one of the following:
        * Replace "favicon.png" in images folder with your icon of same name
        * Rename href below to "./images/(YOUR-IMAGE.EXTENSION)"
        * Rename href below to "(IMAGE-WEB-URL.EXTENSION)" -->
    <link rel="icon" type="image/png" href="./images/favicon.png" />
  </head>

  <body>
    <h1>Math Bingo</h1>

    <div class="gridwrap">
      <!-- Colours -->
      <div class="left">
        <table>
          <!-- Row 1 -->
          <tr>
            <td id="col1" class="col1" onclick="changeActiveCol(1)"></td>
            <td id="col2" class="col2" onclick="changeActiveCol(2)"></td>
          </tr>
          <!-- Row 2 -->
          <tr>
            <td id="col3" class="col3" onclick="changeActiveCol(3)"></td>
            <td id="col4" class="col4" onclick="changeActiveCol(4)"></td>
          </tr>
          <!-- Row 3 -->
          <tr>
            <td id="col5" class="col5" onclick="changeActiveCol(5)"></td>
            <td id="col6" class="col6" onclick="changeActiveCol(6)"></td>
          </tr>
          <!-- Row 4 -->
          <tr>
            <td id="col7" class="col7" onclick="changeActiveCol(7)"></td>
            <td id="col8" class="col8" onclick="changeActiveCol(8)"></td>
          </tr>
        </table>
      </div>

      <!-- Bingo Board -->
      <div class="bingo" class="mid">
        <table>
          <!-- Row 1 -->
          <tr>
            <td id="A" onclick="updateCol(id)">32</td>
            <td id="B" onclick="updateCol('B')">40</td>
            <td id="C" onclick="updateCol('C')">45</td>
            <td id="D" onclick="updateCol('D')">112</td>
          </tr>
          <!-- Row 2 -->
          <tr>
            <td id="E" onclick="updateCol('E')">81</td>
            <td id="F" onclick="updateCol('F')">6</td>
            <td id="G" onclick="updateCol('G')">110</td>
            <td id="H" onclick="updateCol('H')">50</td>
          </tr>
          <!-- Row 3 -->
          <tr>
            <td id="I" onclick="updateCol('I')">56</td>
            <td id="J" onclick="updateCol('J')">12</td>
            <td id="K" onclick="updateCol('K')">25</td>
            <td id="L" onclick="updateCol('L')">56</td>
          </tr>
          <!-- Row 4 -->
          <tr>
            <td id="M" onclick="updateCol('M')">65</td>
            <td id="N" onclick="updateCol('N')">60</td>
            <td id="O" onclick="updateCol('O')">75</td>
            <td id="P" onclick="updateCol('P')">20</td>
          </tr>
        </table>
      </div>

      <!-- Game Numbers -->
      <div class="right">
        <h2>7</h2>
        <h2>9</h2>
        <h2>1</h2>
        <h2>6</h2>
      </div>
    </div>
  </body>
</html>
