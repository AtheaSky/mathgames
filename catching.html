<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style/main.css" />
    <link rel="stylesheet" href="./style/catching.css" />

    <script defer src="./scripts/modal.js"></script>
    <script defer src="./scripts/catching.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-confetti@latest/dist/js-confetti.browser.js"></script>

    <!-- Title font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Momo+Trust+Display&display=swap"
      rel="stylesheet"
    />

    <!-- Text on tab name -->
    <title>Creature Catching</title>

    <!-- Site icon on tab. Do one of the following:
        * Replace "favicon.png" in images folder with your icon of same name
        * Rename href below to "./images/(YOUR-IMAGE.EXTENSION)"
        * Rename href below to "(IMAGE-WEB-URL.EXTENSION)" -->
    <link rel="icon" type="image/png" href="./images/favicon.png" />
  </head>

  <body>
    <div class="modal" id="introModal">
      <div class="modal-content">
        <h2>Settings</h2>

        <br />

        X
        <select name="operators" id="operators">
          <option value="+">+</option>
          <option value="-">-</option>
          <option value="×">×</option>
          <option value="÷">÷</option>
        </select>
        Y

        <br /><br />

        <div>
          <label>X Range:</label>
          <input type="number" id="xMin" min="1" max="1000" value="1" /> to
          <input type="number" id="xMax" min="1" max="1000" value="10" />
        </div>
        <div>
          <label>Y Range:</label>
          <input type="number" id="yMin" min="1" max="1000" value="1" /> to
          <input type="number" id="yMax" min="1" max="1000" value="10" />
        </div>

        <br />

        <div class="modalBtn btn" onClick="start('+')">Start</div>
      </div>
    </div>

    <h1>Creature Catching</h1>

    <div class="gridwrap">
      <div class="left">
        <table id="fishTable">
          <tr>
            <td><img src="./images/fish1.png" class="creature" /></td>
            <td><img src="./images/fish1.png" class="creature" /></td>
            <td><img src="./images/fish1.png" class="creature" /></td>
          </tr>
          <tr>
            <td><img src="./images/fish1.png" class="creature" /></td>
            <td><img src="./images/fish1.png" class="creature" /></td>
            <td><img src="./images/fish1.png" class="creature" /></td>
          </tr>
        </table>
      </div>
      <div class="right">
        <table id="cardTable">
          <tr>
            <td><img src="./images/card.png" class="card" /></td>
            <td><img src="./images/card.png" class="card" /></td>
          </tr>
          <tr>
            <td><img src="./images/card.png" class="card" /></td>
            <td><img src="./images/card.png" class="card" /></td>
          </tr>
          <tr>
            <td><img src="./images/card.png" class="card" /></td>
            <td><img src="./images/card.png" class="card" /></td>
          </tr>
        </table>
      </div>
    </div>

    <!-- Instructions -->
    <hr />
    <p>Instructions</p>
  </body>
</html>
