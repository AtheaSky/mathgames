<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style/main.css" />
    <link rel="stylesheet" href="./style/catching.css" />

    <script defer src="./scripts/modal.js"></script>
    <script defer src="./scripts/opQues.js"></script>
    <script defer src="./scripts/catching.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-confetti@latest/dist/js-confetti.browser.js"></script>

    <!-- Title font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Momo+Trust+Display&display=swap"
      rel="stylesheet"
    />

    <!-- Text on tab name -->
    <title>Creature Catching</title>

    <!-- Site icon on tab. Do one of the following:
        * Replace "favicon.png" in images folder with your icon of same name
        * Rename href below to "./images/(YOUR-IMAGE.EXTENSION)"
        * Rename href below to "(IMAGE-WEB-URL.EXTENSION)" -->
    <link rel="icon" type="image/png" href="./images/favicon.png" />
  </head>

  <body>
    <!-- Intro settings modal -->
    <div class="modal" id="introModal">
      <div class="modal-content">
        <h2>Settings</h2>

        <br />

        X
        <select name="operator" id="operator">
          <option value="+">+</option>
          <option value="-">-</option>
          <option value="×">×</option>
          <option value="÷">÷</option>
        </select>
        Y

        <br /><br />

        <div>
          <label>X Range:</label>
          <input type="number" id="xMin" min="1" max="1000" value="1" /> to
          <input type="number" id="xMax" min="1" max="1000" value="10" />
        </div>
        <div>
          <label>Y Range:</label>
          <input type="number" id="yMin" min="1" max="1000" value="1" /> to
          <input type="number" id="yMax" min="1" max="1000" value="10" />
        </div>

        <br />

        <div class="modalBtn btn" onClick="start('+')">Start</div>
      </div>
    </div>

    <!-- Catch modal -->
    <div class="modal" id="catchModal">
      <div class="modal-content">
        <label
          for="Question"
          id="currentQuestion"
          style="font-size: 16pt"
        ></label>

        <br /><br />
        <input type="number" id="userAns" max="1000" placeholder="#" />

        <br /><br /><br />

        <div class="modalBtn btn" onClick="catchResult()">Catch!</div>
      </div>
    </div>

    <!-- Main content -->
    <h1>Creature Catching</h1>

    <div class="gridwrap">
      <div class="left">
        <table id="fishTable">
          <tr>
            <td>
              <img
                src="./images/fish1.png"
                class="creature"
                id="creature1"
                onClick="catchAttempt('creature1')"
              />
            </td>
            <td>
              <img
                src="./images/fish1.png"
                class="creature"
                id="creature2"
                onClick="catchAttempt('creature2')"
              />
            </td>
            <td>
              <img
                src="./images/fish1.png"
                class="creature"
                id="creature3"
                onClick="catchAttempt('creature3')"
              />
            </td>
          </tr>
          <tr>
            <td>
              <img
                src="./images/fish1.png"
                class="creature"
                id="creature4"
                onClick="catchAttempt('creature4')"
              />
            </td>
            <td>
              <img
                src="./images/fish1.png"
                class="creature"
                id="creature5"
                onClick="catchAttempt('creature5')"
              />
            </td>
            <td>
              <img
                src="./images/fish1.png"
                class="creature"
                id="creature6"
                onClick="catchAttempt('creature6')"
              />
            </td>
          </tr>
        </table>
      </div>
      <div class="right">
        <table id="cardTable">
          <tr>
            <td>
              <img
                src="./images/card.png"
                class="card"
                id="card1"
                style="visibility: hidden"
              />
            </td>
            <td>
              <img
                src="./images/card.png"
                class="card"
                id="card2"
                style="visibility: hidden"
              />
            </td>
          </tr>
          <tr>
            <td>
              <img
                src="./images/card.png"
                class="card"
                id="card3"
                style="visibility: hidden"
              />
            </td>
            <td>
              <img
                src="./images/card.png"
                class="card"
                id="card4"
                style="visibility: hidden"
              />
            </td>
          </tr>
          <tr>
            <td>
              <img
                src="./images/card.png"
                class="card"
                id="card5"
                style="visibility: hidden"
              />
            </td>
            <td>
              <img
                src="./images/card.png"
                class="card"
                id="card6"
                style="visibility: hidden"
              />
            </td>
          </tr>
        </table>
      </div>
    </div>

    <!-- Instructions -->
    <hr />
    <p>Instructions</p>
  </body>
</html>
