<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style/main.css" />
    <link rel="stylesheet" href="./style/apples.css" />

    <script defer src="./scripts/modal.js"></script>
    <script defer src="./scripts/apples.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-confetti@latest/dist/js-confetti.browser.js"></script>

    <!-- Title font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Momo+Trust+Display&display=swap"
      rel="stylesheet"
    />

    <!-- Text on tab name -->
    <title>Apple Picking</title>

    <!-- Site icon on tab. Do one of the following:
        * Replace "favicon.png" in images folder with your icon of same name
        * Rename href below to "./images/(YOUR-IMAGE.EXTENSION)"
        * Rename href below to "(IMAGE-WEB-URL.EXTENSION)" -->
    <link rel="icon" type="image/png" href="./images/favicon.png" />
  </head>

  <body>
    <h1>Apple Picking</h1>

    <div class="gridwrap">
      <div class="sign">
        <img src="./images/sign.png" width="270px" id="signImg" />
      </div>
      <div class="basket">
        <img src="./images/basket.png" width="220px" />
      </div>

      <div class="sign" id="signLabel">Mode?</div>
      <div class="sign" id="signBox"></div>
      <div class="tree" id="treeArea"></div>
    </div>

    <!-- Instructions -->
    <hr />
    <p>Instruction</p>
  </body>
</html>
